[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mjwarp-ur5e"
version = "0.1.0"
description = "Development workspace for robotics algorithms with MuJoCo, Warp, and UR5e"
requires-python = ">=3.10"

[project.scripts]
mjwarp-ur5e-load = "mjwarp_ur5e.demos.load_ur5e_mujoco:main"
mjwarp-ur5e-inspect = "mjwarp_ur5e.demos.inspect_ur5e_mujoco:main"
mjwarp-ur5e-render-home = "mjwarp_ur5e.demos.render_ur5e_home:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]